<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030509" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.18" filter="url(#glow)" />
  
  <g text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="200" fill="url(#accentGrad)">
    <text x="256" y="260" letter-spacing="-6">AS</text>
  </g>
  
  <circle cx="390" cy="130" r="26" fill="#10b981" filter="url(#glow)" />
</svg>